name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore AquaBlend.sln

      - name: Build solution
        run: dotnet build AquaBlend.sln --no-restore

      - name: Run tests
        run: dotnet test AquaBlend.sln --no-build
